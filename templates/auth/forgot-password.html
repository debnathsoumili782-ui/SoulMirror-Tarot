<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | SoulMirror Tarot</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/auth.css') }}">
</head>

<body>

<div class="auth-container">

    <div class="auth-card forgot-card">

        <div class="forgot-icon">
            ✦
        </div>

        <h1>Forgot Password?</h1>

        <p class="subtitle">
            Enter your email and we’ll send you a secure link
            to reset your password.
        </p>

        {% if error %}
            <div class="auth-message error-message">
                {{ error }}
            </div>
        {% endif %}

        {% if success %}
            <div class="auth-message success-message">
                {{ success }}
            </div>
        {% endif %}

        <form method="POST">

            <input
                type="email"
                name="email"
                placeholder="Email Address"
                required
            >

            <button type="submit">
                Send Reset Link
            </button>

        </form>

        <p class="bottom-text">
            Remember your password?
            <a href="{{ url_for('auth.login') }}">
                Back to Login
            </a>
        </p>

    </div>

</div>

</body>
</html>
